<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>madryxen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            /* HÁTTÉRKÉP BEÁLLÍTÁSA */
            background: linear-gradient(rgba(15, 12, 32, 0.75), rgba(6, 4, 10, 0.85)), 
                        url('[url=https://ibb.co/Y7KJy5Mx][img]https://i.ibb.co/mCYdXnw3/IMG-1112.jpg[/img][/url]') no-repeat center center fixed;
            background-size: cover;
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 30px 20px; 
        }
        .profile-container { text-align: center; margin-bottom: 30px; }
        
        /* KÖR ALAKÚ PROFILKÉP KERETTEL */
        .profile-img-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            position: relative;
        }
        .profile-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; /* Ez csinál belőle tökéletes kört */
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8); /* Finom fehér belső keret */
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2), 0 8px 32px rgba(0, 0, 0, 0.5); /* Neonos ragyogás és árnyék */
        }
        
        h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .links-container { width: 100%; max-width: 340px; }
        .btn { 
            display: block; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white; 
            text-decoration: none; 
            text-align: center; 
            padding: 16px; 
            margin: 14px 0; 
            border-radius: 16px; 
            font-weight: 600; 
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:active { 
            transform: scale(0.97); 
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="profile-img-container">
            <img src="[url=https://ibb.co/XrFNNsCg][img]https://i.ibb.co/fzrBBpx5/A5-A0-D5-DF-EF67-4560-8-FA8-C6-FF4828-B094.jpg[/img][/url]" alt="madryxen" class="profile-img">
        </div>
        <h1>@madryxen</h1>
    </div>

    <div class="links-container">
        <a href="INSTAGRAM_LINK_HELYE" class="btn" target="_blank">Instagram</a>
        <a href="TIKTOK_LINK_HELYE" class="btn" target="_blank">TikTok</a>
        <a href="X_LINK_HELYE" class="btn" target="_blank">X (Twitter)</a>
        <a href="LINKEDIN_LINK_HELYE" class="btn" target="_blank">LinkedIn</a>
    </div>

</body>
</html>
