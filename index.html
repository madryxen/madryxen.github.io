<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>madryxen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            /* A PÁLMAFÁS HÁTTÉRKÉPED */
            background: linear-gradient(rgba(10, 8, 20, 0.6), rgba(6, 4, 10, 0.85)), 
                        url('https://i.imgur.com/KB59OL8.jpeg') no-repeat center center fixed;⁠
            background-size: cover;
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 40px 20px; 
        }
        .profile-container { text-align: center; margin-bottom: 30px; }
        
        /* TÖKÉLETES KÖR ALAKÚ PROFILKÉP A SELFIEDDEL */
        .profile-img-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            position: relative;
        }
        .profile-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%;
            object-fit: cover;
            object-position: center 30%; /* Kicsit feljebb igazítja a képet, hogy az arcod tökéletesen középen legyen */
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25), 0 10px 35px rgba(0, 0, 0, 0.6);
        }
        
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 5px; text-shadow: 0 2px 15px rgba(0,0,0,0.7); }
        .links-container { width: 100%; max-width: 340px; }
        
        /* MODERN ÜVEG-EFFEKTUSÚ GOMBOK */
        .btn { 
            display: block; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: white; 
            text-decoration: none; 
            text-align: center; 
            padding: 18px; 
            margin: 16px 0; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 16px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn:active { 
            transform: scale(0.96); 
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="profile-img-container">
            <img src="⁠https://i.imgur.com/nF7DfIo.jpeg⁠"
        </div>
        <h1>@madryxen</h1>
    </div>

    <div class="links-container">
        <!-- ITT CSERÉLD KI A LEVELEKET A SAJÁT PROFILJAID LINKJÉRE! -->
        <a href="https://instagram.com/madryxen" class="btn" target="_blank">Instagram</a>
        <a href="https://www.tiktok.com/@madryxen?_r=1&_t=ZN-97Kx3XIeXlm" class="btn" target="_blank">TikTok</a>
        <a href="https://x.com/madryxen?s=11" class="btn" target="_blank">X (Twitter)</a>
        <a href="https://linkedin.com/in/madryxen" class="btn" target="_blank">LinkedIn</a>
    </div>

</body>
</html>
